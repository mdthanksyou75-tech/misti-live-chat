<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misti 100% Final Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0a0a0a;color:#fff}
#login{position:fixed;inset:0;z-index:9999;background:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#login input{padding:14px 22px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:#fff;width:300px;text-align:center}
#login button{padding:12px 40px;border-radius:25px;border:none;background:#ff4d8d;color:#fff;font-weight:bold;cursor:pointer}
.app{display:flex;height:100vh}
.sidebar{width:340px;background:#141414;border-right:1px solid #222;display:flex;flex-direction:column}
.sidebar h2{padding:16px;color:#ff4d8d;border-bottom:1px solid #222;font-size:13px;text-align:center}
.tabs{display:flex;gap:3px;padding:6px;border-bottom:1px solid #222;flex-wrap:wrap}
.tabs button{padding:5px 8px;border-radius:15px;border:1px solid #333;background:#222;color:#aaa;font-size:10px;cursor:pointer}
.tabs button.active{background:#ff4d8d;color:#fff}
#userList{flex:1;overflow-y:auto}
.uitem{padding:10px 12px;border-bottom:1px solid #1a1a1a;cursor:pointer;display:flex;justify-content:space-between;font-size:12px}
.uitem.active{background:#ff4d8d22;border-left:3px solid #ff4d8d}
.vip{border-radius:8px;padding:1px 6px;font-size:9px;font-weight:bold}
.vip1{background:#cd7f32}.vip2{background:#c0c0c0;color:#000}.vip3{background:#ffd700;color:#000}.vip4{background:#00e5ff;color:#000}.vip5{background:#ff1744}.vip6{background:linear-gradient(45deg,gold,red)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{padding:8px 12px;background:#141414;border-bottom:1px solid #222;display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px}
.controls{display:flex;gap:4px;flex-wrap:wrap}
.controls button,.controls input{padding:6px 9px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:11px}
.g{background:#00c85322!important;border-color:#00c853!important;color:#4cff8a!important}
.r{background:#ff2a2a22!important;border-color:#ff3b3b!important}
.p{background:#ff4d8d!important;border:none!important}
.y{background:#ffab00!important;color:#000!important;border:none!important}
.panel{padding:10px;overflow-y:auto;flex:1;display:grid;gap:10px;align-content:start}
.card{background:#141414;border:1px solid #222;border-radius:12px;padding:12px}
.card h3{color:#ff4d8d;margin-bottom:8px;font-size:12px;border-bottom:1px solid #222;padding-bottom:6px}
.row{display:flex;gap:5px;margin:5px 0;align-items:center;flex-wrap:wrap}
.row label{width:95px;color:#888;font-size:10px}
.row input,.row select{flex:1;padding:7px 9px;border-radius:7px;border:1px solid #333;background:#222;color:#fff;font-size:11px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}
.sbox{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:8px;padding:8px;text-align:center}
.sbox b{display:block;color:#ff4d8d;font-size:14px}.sbox small{color:#777;font-size:9px}
.list{max-height:120px;overflow-y:auto;background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:6px;font-size:10px;margin-top:6px}
</style>
</head>
<body>
<div id="login">
<h1 style="color:#ff4d8d">👑 MISTI FINAL ADMIN</h1>
<input id="pass" type="password" placeholder="Password: misti123">
<button onclick="login()">Login</button>
<p id="err" style="color:#ff6b6b;font-size:11px"></p>
</div>
<div class="app">
<div class="sidebar">
<h2>👑 MISTI FINAL ADMIN</h2>
<div class="tabs">
<button class="active" onclick="setTab('all')">All</button>
<button onclick="setTab('live')">Live</button>
<button onclick="setTab('host')">Host</button>
<button onclick="setTab('svip')">SVIP</button>
</div>
<div class="stat">
<div class="sbox"><b id="tUsers">0</b><small>Users</small></div>
<div class="sbox"><b id="tLive">0</b><small>Live</small></div>
<div class="sbox"><b id="tIncome">$0</b><small>Income</small></div>
</div>
<div id="userList"></div>
</div>
<div class="main">
<div class="top">
<b id="chatWith" style="font-size:12px">Select User</b>
<div class="controls">
<input id="amt" placeholder="$" type="number" style="width:70px">
<button class="g" onclick="doRecharge('wallet')">Wallet+</button>
<button class="g" onclick="doRecharge('diamond')">Diamond+</button>
<button id="banBtn" class="r" onclick="toggleBan()">Ban</button>
</div>
</div>
<div class="panel">
<div class="card">
<h3>👑 SVIP & Level - Fixed 500/1000/3000/4000/6000/10000</h3>
<div class="row"><label>SVIP:</label>
<select id="svipLevel"><option value="0">No SVIP</option><option value="1">SVIP 1 - $500</option><option value="2">SVIP 2 - $1000</option><option value="3">SVIP 3 - $3000</option><option value="4">SVIP 4 - $4000</option><option value="5">SVIP 5 - $6000</option><option value="6">SVIP 6 - $10000</option></select>
<button class="p" onclick="saveSVIP()">Set SVIP</button></div>
<div class="row"><label>Total $:</label><input id="totalRe" disabled><span id="svipNote" style="color:gold;font-size:10px"></span></div>
<div class="row"><label>Wallet $:</label><input id="wBal" type="number"><button onclick="saveWallet()">Save</button><label style="width:60px">Diamond:</label><input id="dBal" type="number"><button onclick="saveDiamond()">Save</button></div>
<div class="row"><label>Level 1-100:</label><input id="uLevel" type="number" min="1" max="100"><button class="y" onclick="saveLevel()">Set Level</button><label style="width:50px">Role:</label><select id="userRole"><option value="user">User</option><option value="host">Host</option><option value="agency">Agency</option></select><button class="p" onclick="saveRole()">Set Role</button></div>
</div>
<div class="card">
<h3>💱 Convert Rate Control</h3>
<div class="row"><label>100 Dia = $</label><input id="rateDollar" placeholder="1"><button onclick="saveRate()">Save</button></div>
<div class="row"><label>1 Dia = Coin</label><input id="rateCoin" placeholder="70"><button onclick="saveRate()">Save</button></div>
</div>
<div class="card">
<h3>🎁 Gift Store Control</h3>
<div class="row"><select id="giftList"><option value="Rose">Rose</option><option value="Heart">Heart</option><option value="Ring">Ring</option><option value="Car">Car</option><option value="Lion">Lion</option><option value="Crown">Crown</option></select><input id="giftPrice" type="number" placeholder="Price Dia"><button class="p" onclick="saveGift()">Set Price</button></div>
<div id="giftPrices" class="list"></div>
</div>
<div class="card">
<h3>📢 Banner & Push</h3>
<div class="row"><label>Banner:</label><input id="bannerTxt" placeholder="Eid Event"><button class="y" onclick="saveBanner()">Set Banner</button></div>
<div class="row"><label>Push All:</label><input id="pushTxt" placeholder="Message"><button class="p" onclick="sendPush()">Send Push</button></div>
</div>
<div class="card">
<h3>🔴 Live + Bot Viewer</h3>
<div class="row"><label>Live Info:</label><input id="liveInfo" disabled><button class="r" onclick="freezeLive()">Freeze</button></div>
<div class="row"><label>Fake Viewer:</label><input id="botCount" type="number" placeholder="25"><button class="y" onclick="saveBot()">Set Bot</button><button onclick="toggleBot()">On/Off</button></div>
<div id="liveList" class="list"></div>
</div>
</div>
</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,get,set,update,push}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
  apiKey: "AIzaSyA....xyz",
  authDomain: "misti-live-chat.firebaseapp.com",
  databaseURL: "https://misti-live-chat-default-rtdb.firebaseio.com",
  projectId: "misti-live-chat",
  storageBucket: "misti-live-chat.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123:web:abcd"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
window.login=()=>{if(document.getElementById('pass').value==="misti123"){document.getElementById('login').style.display='none'}else{document.getElementById('err').innerText='Wrong Password!'}};
let cur=null,banned=false,curTab='all';
function getSVIP(total){if(total>=10000)return 6;if(total>=6000)return 5;if(total>=4000)return 4;if(total>=3000)return 3;if(total>=1000)return 2;if(total>=500)return 1;return 0;}
window.setTab=(t)=>{curTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');loadUsers()};
function loadUsers(){
onValue(ref(db,'users'),(snap)=>{
const data=snap.val()||{};
const ul=document.getElementById('userList');
ul.innerHTML='';let liveC=0,income=0;
const liveDiv=document.getElementById('liveList');
liveDiv.innerHTML='';
Object.keys(data).forEach(uid=>{
const u=data[uid];
income+=(u.todayRecharge||0);
if(u.isLive)liveC++;
if(curTab==='host'&&u.role!=='host')return;
if(curTab==='svip'&&(u.svipLevel||0)==0)return;
if(curTab==='live'&&!u.isLive)return;
if(u.isLive){liveDiv.innerHTML+=`${uid.slice(0,8)} - ${u.liveViewers||0} viewers<br>`}
const svip=u.svipLevel||0;
const div=document.createElement('div');
div.className='uitem'+(cur===uid?' active':'');
div.innerHTML=`<span><b>${uid.slice(0,8)} ${svip>0?`<span class="vip vip${svip}">SVIP ${svip}</span>`:''} ${u.isLive?'🔴':''}</b><br><small style="color:#888">${u.role||'user'} Lv${u.userLevel||1} | $${u.totalRecharge||0}</small></span><small>${u.isLive?(u.liveViewers||0)+'👁':''}</small>`;
div.onclick=()=>openChat(uid);
ul.appendChild(div);
});
document.getElementById('tUsers').textContent=Object.keys(data).length;
document.getElementById('tLive').textContent=liveC;
document.getElementById('tIncome').textContent='$'+income;
});
onValue(ref(db,'config/gifts'),(snap)=>{const d=snap.val()||{};const el=document.getElementById('giftPrices');el.innerHTML='';Object.keys(d).forEach(g=>{el.innerHTML+=`${g}: ${d[g]} Dia<br>`})});
onValue(ref(db,'config/rates'),(snap)=>{const r=snap.val()||{};if(r.dollar)document.getElementById('rateDollar').value=r.dollar;if(r.coin)document.getElementById('rateCoin').value=r.coin});
}
loadUsers();
window.openChat=async(uid)=>{
cur=uid;
document.getElementById('chatWith').textContent=uid;
const s=await get(ref(db,'users/'+uid));
const u=s.val()||{};
document.getElementById('wBal').value=u.wallet||0;
document.getElementById('dBal').value=u.diamonds||0;
document.getElementById('totalRe').value=u.totalRecharge||0;
document.getElementById('svipLevel').value=u.svipLevel||0;
document.getElementById('userRole').value=u.role||'user';
document.getElementById('uLevel').value=u.userLevel||1;
document.getElementById('liveInfo').value=u.isLive?`LIVE - ${u.liveViewers||0} viewers`: 'Offline';
document.getElementById('svipNote').textContent=u.totalRecharge?`Auto SVIP ${getSVIP(u.totalRecharge)}`:'';
const b=await get(ref(db,'banned/'+uid));
banned=b.val()===true;
document.getElementById('banBtn').textContent=banned?'Unban':'Ban';
};
window.doRecharge=(type)=>{
const a=document.getElementById('amt').value;
if(!a||!cur)return alert('Amount লিখুন ভাই');
const v=parseInt(a);
get(ref(db,'users/'+cur)).then(s=>{
let u=s.val()||{};
u.wallet=(parseInt(u.wallet)||0)+(type==='wallet'?v:0);
u.diamonds=(parseInt(u.diamonds)||0)+(type==='diamond'?v:0);
u.totalRecharge=(parseInt(u.totalRecharge)||0)+v;
u.todayRecharge=(parseInt(u.todayRecharge)||0)+v;
u.svipLevel=getSVIP(u.totalRecharge);
update(ref(db,'users/'+cur),u);
alert(`${type} $${v} Done! SVIP ${u.svipLevel} | Total $${u.totalRecharge}`);
openChat(cur);
});
};
window.saveSVIP=()=>{if(!cur)return;update(ref(db,'users/'+cur),{svipLevel:parseInt(document.getElementById('svipLevel').value)});alert('SVIP Set');};
window.saveWallet=()=>{if(!cur)return;update(ref(db,'users/'+cur),{wallet:parseInt(document.getElementById('wBal').value)||0});alert('Wallet Saved');};
window.saveDiamond=()=>{if(!cur)return;update(ref(db,'users/'+cur),{diamonds:parseInt(document.getElementById('dBal').value)||0});alert('Diamond Saved');};
window.saveLevel=()=>{if(!cur)return;update(ref(db,'users/'+cur),{userLevel:parseInt(document.getElementById('uLevel').value)||1});alert('Level Saved');};
window.saveRole=()=>{if(!cur)return;update(ref(db,'users/'+cur),{role:document.getElementById('userRole').value});alert('Role Saved');};
window.toggleBan=()=>{if(!cur)return;set(ref(db,'banned/'+cur),!banned);alert(banned?'Unbanned':'Banned');};
window.saveRate=()=>{const d=document.getElementById('rateDollar').value;const c=document.getElementById('rateCoin').value;update(ref(db,'config/rates'),{dollar:d,coin:c});alert(`Rate Saved`);};
window.saveGift=()=>{const g=document.getElementById('giftList').value;const p=document.getElementById('giftPrice').value;if(!p)return alert('Price লিখুন');set(ref(db,'config/gifts/'+g),parseInt(p));alert(g+' Price '+p+' Dia');};
window.saveBanner=()=>{const t=document.getElementById('bannerTxt').value;set(ref(db,'config/banner'),{text:t,time:Date.now()});alert('Banner Set');};
window.sendPush=()=>{const t=document.getElementById('pushTxt').value;if(!t)return;push(ref(db,'push'),{text:t,time:Date.now()});alert('Push Sent!');};
window.freezeLive=()=>{if(!cur)return;set(ref(db,'users/'+cur+'/isLive'),false);alert('Live Freezed');};
window.saveBot=()=>{const c=document.getElementById('botCount').value;set(ref(db,'config/bot'),{count:parseInt(c),enabled:true});alert('Bot Set: '+c);};
window.toggleBot=()=>{get(ref(db,'config/bot')).then(s=>{const b=s.val()||{enabled:false};set(ref(db,'config/bot'),{...b,enabled:!b.enabled});alert(b.enabled?'Bot OFF':'Bot ON');});};
</script>
</body>
</html>
