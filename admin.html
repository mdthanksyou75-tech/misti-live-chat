<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misti Admin</title><style>body{font-family:system-ui;background:#f5f0ff;margin:0}header{background:#7c3aed;color:#fff;padding:16px;font-weight:800;font-size:20px}.box{padding:20px}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px}button{background:#7c3aed;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:700;margin-top:8px}#msgs{height:300px;overflow:auto;background:#fff;border-radius:12px;padding:12px}.msg{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:80%}.user{background:#fff;border:1px solid #eee}.admin{background:#7c3aed;color:#fff;margin-left:auto}</style></head><body><header>💜 Misti Live Chat - Admin</header><div class="box"><div class="card"><b>Admin Login</b><br><small>আপনার চ্যাট লিংক:</small><br><code id="link"></code></div><div id="msgs"></div><div class="card"><input id="t" placeholder="Reply লিখুন..."><button onclick="send()">Send</button></div></div><script>let db=JSON.parse(localStorage.getItem('misti')||'[]');function render(){let m=document.getElementById('msgs');m.innerHTML='';db.forEach(x=>{let d=document.createElement('div');d.className='msg '+(x.me?'admin':'user');d.innerText=x.text;m.appendChild(d)});m.scrollTop=m.scrollHeight}function send(){let v=document.getElementById('t').value;if(!v)return;db.push({text:v,me:true});localStorage.setItem('misti',JSON.stringify(db));document.getElementById('t').value='';render()}render();document.getElementById('link').innerText=location.href.replace('admin.html','');setInterval(()=>{let d=JSON.parse(localStorage.getItem('misti')||'[]');if(d.length!=db.length){db=d;render()}},1000)</script></body></html>
